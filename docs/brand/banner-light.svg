<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="M42 UI: build websites with AI, on your own PC">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eef0ff"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<radialGradient id="g1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#4f46e5" stroke-opacity=".07"/></pattern>
<clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="200" cy="170" r="260" fill="url(#g1)"><animate attributeName="opacity" values=".7;1;.7" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1010" cy="190" r="300" fill="url(#g2)"><animate attributeName="opacity" values="1;.65;1" dur="7s" repeatCount="indefinite"/></circle>

<!-- logo mark -->
<rect x="96" y="96" width="128" height="128" rx="34" fill="url(#brand)"/>
<rect x="96" y="96" width="128" height="128" rx="34" fill="url(#shine)"/>
<text x="160" y="178" text-anchor="middle" font-size="50" font-weight="800" fill="#fff" letter-spacing="-1" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">M42</text>

<!-- title -->
<text x="250" y="190" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-3" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">M42 UI</text>
<text x="254" y="236" font-size="27" font-weight="500" fill="#475569" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">Build websites with AI, on your own PC.</text>
<rect x="250" y="262" width="145" height="34" rx="17" fill="#4f46e5" fill-opacity=".08" stroke="#4f46e5" stroke-opacity=".18"/><text x="322.5" y="284" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">Landing pages</text><rect x="405" y="262" width="171" height="34" rx="17" fill="#4f46e5" fill-opacity=".08" stroke="#4f46e5" stroke-opacity=".18"/><text x="490.5" y="284" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">3D landing pages</text><rect x="586" y="262" width="137" height="34" rx="17" fill="#4f46e5" fill-opacity=".08" stroke="#4f46e5" stroke-opacity=".18"/><text x="654.5" y="284" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">Admin panels</text>

<!-- landing page window -->
<g transform="translate(870 64)">
<rect width="330" height="210" rx="16" fill="#ffffff" stroke="#dfe3f5"/>
<circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="37" cy="20" r="5" fill="#fbbf24"/><circle cx="54" cy="20" r="5" fill="#34d399"/>
<rect x="74" y="13" width="200" height="14" rx="7" fill="#e6e9f6"/>
<rect x="20" y="44" width="290" height="80" rx="10" fill="url(#hero)"/>
<rect x="34" y="62" width="130" height="12" rx="6" fill="#fff" fill-opacity=".9"/>
<rect x="34" y="82" width="90" height="8" rx="4" fill="#fff" fill-opacity=".6"/>
<rect x="34" y="100" width="54" height="14" rx="7" fill="#fff"/>
<rect x="20" y="138" width="90" height="56" rx="8" fill="#e6e9f6"/><rect x="120" y="138" width="90" height="56" rx="8" fill="#e6e9f6"/><rect x="220" y="138" width="90" height="56" rx="8" fill="#e6e9f6"/>
</g>

<!-- dashboard card -->
<g transform="translate(800 196)">
<animateTransform attributeName="transform" type="translate" values="800 196;800 190;800 196" dur="5s" repeatCount="indefinite"/>
<rect width="210" height="124" rx="14" fill="#ffffff" stroke="#dfe3f5"/>
<rect x="16" y="16" width="70" height="9" rx="4.5" fill="#e6e9f6"/>
<text x="16" y="52" font-size="22" font-weight="800" fill="#1e1b4b" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">₹45.2L</text>
<rect x="16"  y="86" width="16" height="22" rx="4" fill="#8b5cf6" fill-opacity=".45"/>
<rect x="38"  y="74" width="16" height="34" rx="4" fill="#8b5cf6" fill-opacity=".6"/>
<rect x="60"  y="80" width="16" height="28" rx="4" fill="#8b5cf6" fill-opacity=".5"/>
<rect x="82"  y="64" width="16" height="44" rx="4" fill="#8b5cf6" fill-opacity=".75"/>
<rect x="104" y="70" width="16" height="38" rx="4" fill="#6366f1" fill-opacity=".8"/>
<rect x="126" y="54" width="16" height="54" rx="4" fill="url(#brand)"/>
<path d="M150 98 L166 84 L178 90 L194 66" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- 3D cube -->
<g transform="translate(1170 210)">
<animateTransform attributeName="transform" type="translate" values="1170 210;1170 196;1170 210" dur="4s" repeatCount="indefinite"/>
<ellipse cx="0" cy="92" rx="44" ry="9" fill="#000" fill-opacity=".18"/>
<path d="M0 -6 L50 20 L0 46 L-50 20 Z" fill="#a78bfa"/>
<path d="M-50 20 L0 46 L0 100 L-50 74 Z" fill="#7c3aed"/>
<path d="M50 20 L0 46 L0 100 L50 74 Z" fill="#4f46e5"/>
<path d="M0 -6 L50 20 L0 46 L-50 20 Z" fill="none" stroke="#fff" stroke-opacity=".35"/>
</g>
<g fill="#fff" fill-opacity=".0"><circle cx="1110" cy="40" r="2"/><circle cx="760" cy="90" r="1.5"/><circle cx="1240" cy="140" r="1.5"/><circle cx="700" cy="300" r="1.5"/></g>
</g>
</svg>